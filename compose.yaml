name: swiftdrop-local

networks:
  backend:
    internal: true
  egress: {}

volumes:
  broker-data:
  object-data:

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: local_admin
      RABBITMQ_DEFAULT_PASS: ${BROKER_ADMIN_PASSWORD:?Set a generated local broker admin password in .env}
      RABBITMQ_ERLANG_COOKIE: ${BROKER_ADMIN_PASSWORD:?Set a generated local broker admin password in .env}
    volumes:
      - broker-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  broker-init:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_ERLANG_COOKIE: ${BROKER_ADMIN_PASSWORD:?Set a generated local broker admin password in .env}
      DELIVERY_BROKER_PASSWORD: ${DELIVERY_BROKER_PASSWORD:?Set a distinct Delivery broker password in .env}
      WORKER_BROKER_PASSWORD: ${WORKER_BROKER_PASSWORD:?Set a distinct Worker broker password in .env}
    volumes:
      - ./deployment/broker/init-users.sh:/init-users.sh:ro
    entrypoint: ["sh", "/init-users.sh"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  object-store:
    image: ${OBJECT_STORE_IMAGE:-minio/minio:latest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local_admin
      MINIO_ROOT_PASSWORD: ${OBJECT_ROOT_PASSWORD:?Set a generated local object-store password in .env}
    volumes:
      - object-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  object-init:
    image: ${OBJECT_CLIENT_IMAGE:-minio/mc:latest}
    environment:
      MINIO_ROOT_USER: local_admin
      MINIO_ROOT_PASSWORD: ${OBJECT_ROOT_PASSWORD:?Set a generated local object-store password in .env}
      DELIVERY_OBJECT_ACCESS_KEY: ${DELIVERY_OBJECT_ACCESS_KEY:-delivery-local}
      DELIVERY_OBJECT_SECRET_KEY: ${DELIVERY_OBJECT_SECRET_KEY:?Set a Delivery object-store secret in .env}
    volumes:
      - ./deployment/object-store/init-storage.sh:/init-storage.sh:ro
      - ./k8s/base/delivery-policy.json:/config/delivery-policy.json:ro
    entrypoint: ["sh", "/init-storage.sh"]
    depends_on:
      object-store:
        condition: service_healthy
    networks:
      - backend
