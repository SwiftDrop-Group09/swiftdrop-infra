name: Infra CD

on:
  repository_dispatch:
    types: [backend-images-published]
  workflow_dispatch:
    inputs:
      environment:
        description: Target K3s environment
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Immutable GHCR image tag (e.g., sha-a1b2c3d)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.environment || 'staging') || github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set overlay, namespace & image tag
        id: target
        env:
          TARGET_ENV: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.environment || 'staging') || inputs.environment }}
          TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.image_tag || inputs.image_tag }}
        run: |
          case "$TARGET_ENV" in
            staging|production) ;;
            *) printf 'Unsupported deployment environment\n' >&2; exit 1 ;;
          esac

          if ! printf '%s' "$TAG" | grep -Eq '^(sha-[0-9a-f]{7,40}|v?[0-9]+\.[0-9]+(\.[0-9]+)?)$'; then
            printf 'Invalid image tag. Expected an immutable SHA or release tag.\n' >&2
            exit 1
          fi

          if [ "$TARGET_ENV" = "production" ]; then
            echo "overlay=prod" >> "$GITHUB_OUTPUT"
            echo "namespace=swiftdrop-prod" >> "$GITHUB_OUTPUT"
          else
            echo "overlay=staging" >> "$GITHUB_OUTPUT"
            echo "namespace=swiftdrop-staging" >> "$GITHUB_OUTPUT"
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          DEPLOY_KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$DEPLOY_KUBECONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Pin immutable GHCR image tags
        run: |
          cd "k8s/overlays/${{ steps.target.outputs.overlay }}"
          TAG="${{ steps.target.outputs.image_tag }}"
          kubectl kustomize . >/dev/null
          python3 -c '
          import sys, re
          tag = sys.argv[1]
          path = sys.argv[2]
          text = open(path).read()
          text = re.sub(r"(newName: ghcr\.io/swiftdrop-group09/swiftdrop-[^\n]+\n\s+newTag: )[^\n]+", r"\g<1>" + tag, text)
          open(path, "w").write(text)
          ' "$TAG" kustomization.yaml

      - name: Apply dependencies and migrations before application rollout
        env:
          OVERLAY: ${{ steps.target.outputs.overlay }}
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: |
          render_dir="$(mktemp -d)"
          trap 'rm -rf "$render_dir"' EXIT
          kubectl kustomize "k8s/overlays/$OVERLAY" > "$render_dir/all.yaml"
          python3 - "$render_dir" <<'PY'
          from pathlib import Path
          import re
          import sys

          directory = Path(sys.argv[1])
          groups = {"foundation": [], "migrations": [], "application": []}
          for doc in re.split(r"(?m)^---\s*$", (directory / "all.yaml").read_text()):
              match = re.search(r"(?m)^kind: (\S+)", doc)
              if not match:
                  continue
              kind = match[1]
              group = "migrations" if kind == "Job" else (
                  "application" if kind in {"Deployment", "Ingress"} else "foundation"
              )
              groups[group].append(doc.strip())
          for group, docs in groups.items():
              (directory / f"{group}.yaml").write_text("\n---\n".join(docs) + "\n")
          PY
          kubectl apply -f "$render_dir/foundation.yaml"
          kubectl rollout status statefulset/rabbitmq -n "$NAMESPACE" --timeout=180s
          jobs=(identity-migrate delivery-migrate merchant-migrate notifications-migrate)
          kubectl delete job -n "$NAMESPACE" "${jobs[@]}" --ignore-not-found --wait=true
          kubectl apply -f "$render_dir/migrations.yaml"
          kubectl wait -n "$NAMESPACE" --for=condition=complete --timeout=185s "${jobs[@]/#/job/}"
          kubectl apply -f "$render_dir/application.yaml"

      - name: Verify rollout status
        run: |
          NS="${{ steps.target.outputs.namespace }}"
          for dep in identity-service delivery-service merchant-service delivery-outbox-relay notification-worker gateway; do
            kubectl rollout status "deployment/${dep}" -n "$NS" --timeout=180s
          done

      - name: Verify Gateway health and a safe tracking request
        env:
          GATEWAY_HEALTH_URL: ${{ secrets.GATEWAY_HEALTH_URL }}
        run: |
          test -n "$GATEWAY_HEALTH_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$GATEWAY_HEALTH_URL" >/dev/null
          origin="${GATEWAY_HEALTH_URL%/health}"
          result="$(mktemp)"
          trap 'rm -f "$result"' EXIT
          status="$(curl --silent --show-error --max-time 15 --output "$result" --write-out '%{http_code}' \
            "$origin/api/v1/parcels/track/TRK-000000-00")"
          test "$status" = 404
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["code"] == "not_found"' "$result"

      - name: Capture sanitized rollout diagnostics
        if: failure() && steps.target.outputs.namespace != ''
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
        run: python3 scripts/kubernetes_diagnostics.py --namespace "$NAMESPACE" --output rollout-diagnostics.json

      - name: Upload rollout diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rollout-diagnostics-${{ github.run_id }}
          path: rollout-diagnostics.json
          if-no-files-found: ignore
