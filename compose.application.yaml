services:
  identity-service:
    profiles: [application]
    image: swiftdrop/identity:local
    build:
      context: ../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Services/Identity/SwiftDrop.Identity.Api/SwiftDrop.Identity.Api.csproj
    command: ["SwiftDrop.Identity.Api.dll"]
    environment:
      ConnectionStrings__Database: ${IDENTITY_DATABASE_CONNECTION_STRING:?Set the Identity Neon connection string}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Google__WebClientId: ${GOOGLE_WEB_CLIENT_ID}
      Google__AndroidClientId: ${GOOGLE_ANDROID_CLIENT_ID}
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  delivery-service:
    profiles: [application]
    image: swiftdrop/delivery:local
    build:
      context: ../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Services/Delivery/SwiftDrop.Delivery.Api/SwiftDrop.Delivery.Api.csproj
    command: ["SwiftDrop.Delivery.Api.dll"]
    environment:
      ConnectionStrings__Database: ${DELIVERY_DATABASE_CONNECTION_STRING:?Set the Delivery Neon connection string}
      Operations__TimeZone: Asia/Colombo
      Broker__Host: rabbitmq
      Broker__Username: delivery_bus
      Broker__Password: ${DELIVERY_BROKER_PASSWORD:?Set the Delivery broker password}
      ObjectStore__Endpoint: http://object-store:9000
      ObjectStore__Bucket: swiftdrop-private
      ObjectStore__AccessKey: ${DELIVERY_OBJECT_ACCESS_KEY:?Set the Delivery object-store key}
      ObjectStore__SecretKey: ${DELIVERY_OBJECT_SECRET_KEY:?Set the Delivery object-store secret}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__JwksUri: http://identity-service:8080/.well-known/jwks.json
    depends_on:
      broker-init: {condition: service_completed_successfully}
      object-init: {condition: service_completed_successfully}
      identity-service: {condition: service_healthy}
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  merchant-service:
    profiles: [application]
    image: swiftdrop/merchant:local
    build:
      context: ../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Services/Merchant/SwiftDrop.Merchant.Api/SwiftDrop.Merchant.Api.csproj
    command: ["SwiftDrop.Merchant.Api.dll"]
    environment:
      ConnectionStrings__Database: ${MERCHANT_DATABASE_CONNECTION_STRING:?Set the Merchant Neon connection string}
      Delivery__GrpcAddress: http://delivery-service:8081
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__JwksUri: http://identity-service:8080/.well-known/jwks.json
    depends_on:
      delivery-service: {condition: service_healthy}
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification-worker:
    profiles: [application]
    image: swiftdrop/notification-worker:local
    build:
      context: ../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Workers/SwiftDrop.Notification.Worker/SwiftDrop.Notification.Worker.csproj
    command: ["SwiftDrop.Notification.Worker.dll"]
    environment:
      ConnectionStrings__Database: ${NOTIFICATIONS_DATABASE_CONNECTION_STRING:?Set the Notifications Neon connection string}
      Broker__Host: rabbitmq
      Broker__Username: worker_bus
      Broker__Password: ${WORKER_BROKER_PASSWORD:?Set the Worker broker password}
      Merchant__BaseUrl: http://merchant-service:8080
      Delivery__BaseUrl: http://delivery-service:8080
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__JwksUri: http://identity-service:8080/.well-known/jwks.json
    depends_on:
      broker-init: {condition: service_completed_successfully}
      merchant-service: {condition: service_healthy}
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    profiles: [application]
    image: swiftdrop/gateway:local
    build:
      context: ../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Gateway/SwiftDrop.Gateway/SwiftDrop.Gateway.csproj
    command: ["SwiftDrop.Gateway.dll"]
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      Web__Origin: ${WEB_ORIGIN:-http://localhost:5173}
    depends_on:
      identity-service: {condition: service_healthy}
      delivery-service: {condition: service_healthy}
      merchant-service: {condition: service_healthy}
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    profiles: [application]
    image: swiftdrop/web:local
    build:
      context: ../swiftdrop-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:5173:8080"
    volumes:
      - ./deployment/nginx/swiftdrop-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway: {condition: service_healthy}
    networks: [backend]
