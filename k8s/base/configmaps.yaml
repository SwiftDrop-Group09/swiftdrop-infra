apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
  Identity__Tokens__Issuer: https://identity.swiftdrop.invalid
  Identity__Tokens__Audience: swiftdrop-api-local
  Identity__Google__WebClientIds__0: REPLACE_WITH_WEB_CLIENT_ID
  Identity__Google__AndroidClientIds__0: REPLACE_WITH_ANDROID_CLIENT_ID
  Identity__Browser__AllowedOrigins__0: https://app.swiftdrop.example.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
  Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:8081
  Operations__TimeZone: Asia/Colombo
  Broker__Host: rabbitmq
  Broker__Username: delivery_bus
  Identity__Tokens__Issuer: https://identity.swiftdrop.invalid
  Identity__Tokens__Audience: swiftdrop-api-local
  Identity__Tokens__JwksUrl: http://identity-service:8080/.well-known/jwks.json
  Identity__Tokens__AllowInsecureJwks: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: merchant-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
  Delivery__GrpcAddress: http://delivery-service:8081
  Identity__Tokens__Issuer: https://identity.swiftdrop.invalid
  Identity__Tokens__Audience: swiftdrop-api-local
  Identity__Tokens__JwksUrl: http://identity-service:8080/.well-known/jwks.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
  Broker__Host: rabbitmq
  Broker__Username: worker_bus
  Merchant__BaseUrl: http://merchant-service:8080
  Delivery__BaseUrl: http://delivery-service:8080
  Identity__Tokens__Issuer: https://identity.swiftdrop.invalid
  Identity__Tokens__JwksUrl: http://identity-service:8080/.well-known/jwks.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  DOTNET_ENVIRONMENT: Production
  Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
  Web__Origin: https://swiftdrop.local
