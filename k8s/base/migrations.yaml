apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrate
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 1
  template:
    metadata:
      labels: {app: identity-migrate}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: swiftdrop/identity:local
          args: ["SwiftDrop.Identity.Api.dll", "--migrate"]
          env:
            - name: ConnectionStrings__MigrationDatabase
              valueFrom:
                secretKeyRef: {name: identity-migration-secrets, key: ConnectionStrings__MigrationDatabase}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
