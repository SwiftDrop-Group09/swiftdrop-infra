apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftdrop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [api-staging.swiftdrop.example.com]
      secretName: swiftdrop-gateway-tls
  rules:
    - host: api-staging.swiftdrop.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  number: 8080
