apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swiftdrop
spec:
  rules:
    - host: api.swiftdrop.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  number: 8080
