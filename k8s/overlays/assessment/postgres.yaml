apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector: {app: postgres}
  ports:
    - {name: sql, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - secretRef: {name: postgres-bootstrap}
          ports:
            - {name: sql, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -h, "127.0.0.1", -U, postgres]}
          livenessProbe:
            exec: {command: [pg_isready, -h, "127.0.0.1", -U, postgres]}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 150m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: bootstrap, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: bootstrap
          configMap: {name: postgres-bootstrap, defaultMode: 365}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-sql
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [identity-service, delivery-service, merchant-service, notification-worker, delivery-outbox-relay, identity-migrate, delivery-migrate, merchant-migrate, notifications-migrate]
      ports:
        - {protocol: TCP, port: 5432}