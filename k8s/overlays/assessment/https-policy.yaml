apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata: {name: assessment-tls}
spec:
  minVersion: VersionTLS12
  sniStrict: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: assessment-redirect}
spec:
  redirectScheme:
    scheme: https
    port: "18443"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assessment-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: swiftdrop-assessment-assessment-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 8080}