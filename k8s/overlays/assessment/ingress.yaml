apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assessment
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: swiftdrop-assessment-assessment-tls@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [localhost]
      secretName: assessment-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: 8080}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gateway
                port: {number: 8080}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 8080}