apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: swiftdrop-dev
resources:
  - ../../base
  - allow-web-ingress.yaml
patches:
  - target:
      kind: Namespace
      name: swiftdrop
    patch: |-
      - op: replace
        path: /metadata/name
        value: swiftdrop-dev

