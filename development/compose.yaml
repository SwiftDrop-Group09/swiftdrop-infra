name: swiftdrop-development

services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: local_admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Run development/run.sh to initialize local configuration}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity-service:
    image: swiftdrop/identity:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Services/Identity/SwiftDrop.Identity.Api/SwiftDrop.Identity.Api.csproj
    command: ["SwiftDrop.Identity.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      ConnectionStrings__Database: ${IDENTITY_DATABASE_CONNECTION_STRING:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  identity-migrate:
    profiles: ["database-migrations"]
    image: swiftdrop/identity:dev
    command: ["SwiftDrop.Identity.Api.dll", "--migrate"]
    environment:
      ConnectionStrings__MigrationDatabase: ${IDENTITY_MIGRATION_CONNECTION_STRING:-}
    restart: "no"

  delivery-service:
    image: swiftdrop/delivery:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Services/Delivery/SwiftDrop.Delivery.Api/SwiftDrop.Delivery.Api.csproj
    command: ["SwiftDrop.Delivery.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:8081
      ConnectionStrings__Database: ${DELIVERY_DATABASE_CONNECTION_STRING:-}
      Operations__TimeZone: Asia/Colombo
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  merchant-service:
    image: swiftdrop/merchant:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Services/Merchant/SwiftDrop.Merchant.Api/SwiftDrop.Merchant.Api.csproj
    command: ["SwiftDrop.Merchant.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      ConnectionStrings__Database: ${MERCHANT_DATABASE_CONNECTION_STRING:-}
    depends_on:
      delivery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification-worker:
    image: swiftdrop/notification-worker:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Workers/SwiftDrop.Notification.Worker/SwiftDrop.Notification.Worker.csproj
    command: ["SwiftDrop.Notification.Worker.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      ConnectionStrings__Database: ${NOTIFICATIONS_DATABASE_CONNECTION_STRING:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    image: swiftdrop/gateway:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Gateway/SwiftDrop.Gateway/SwiftDrop.Gateway.csproj
    command: ["SwiftDrop.Gateway.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: swiftdrop/web:dev
    build:
      context: ../../swiftdrop-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:5173:8080"
    volumes:
      - ../deployment/nginx/swiftdrop-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  rabbitmq-data:
