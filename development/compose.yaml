name: swiftdrop-development

services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: local_admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Run development/run.sh to initialize local configuration}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      default:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity-service:
    image: swiftdrop/identity:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Services/Identity/SwiftDrop.Identity.Api/SwiftDrop.Identity.Api.csproj
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >
        chown 1654:1654 /tmp/swiftdrop/identity &&
        chown 1654:1654 /home/app/.aspnet/DataProtection-Keys &&
        exec runuser -u app -- sh -c '
          if [ ! -f /tmp/swiftdrop/identity/development.pem ]; then
            dotnet SwiftDrop.Identity.Api.dll --generate-development-key;
          fi &&
          exec dotnet SwiftDrop.Identity.Api.dll
        '
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      ConnectionStrings__Database: ${IDENTITY_DATABASE_CONNECTION_STRING:-}
      Identity__Browser__AllowedOrigins__0: http://localhost:5173
      Identity__Browser__AllowedOrigins__1: http://127.0.0.1:5173
      Identity__Browser__AllowedOrigins__2: http://localhost:5000
      Identity__Browser__AllowedOrigins__3: http://127.0.0.1:5000
      Identity__Browser__AllowedOrigins__4: http://localhost
      Identity__Browser__AllowedOrigins__5: http://127.0.0.1
      Identity__Google__WebClientIds__0: ${IDENTITY_GOOGLE_WEB_CLIENT_ID:-}
      Identity__Proxy__KnownProxies__0: 127.0.0.1
      Identity__Proxy__KnownProxies__1: 172.28.0.10
      Identity__Proxy__KnownProxies__2: 172.28.0.11
      Identity__Proxy__ForwardLimit: "2"
    networks:
      default:
        ipv4_address: 172.28.0.12
    volumes:
      - identity-keys:/tmp/swiftdrop/identity
      - identity-dataprotection:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  identity-migrate:
    profiles: ["database-migrations"]
    image: swiftdrop/identity:dev
    command: ["SwiftDrop.Identity.Api.dll", "--migrate"]
    environment:
      ConnectionStrings__MigrationDatabase: ${IDENTITY_MIGRATION_CONNECTION_STRING:-}
    restart: "no"

  delivery-service:
    image: swiftdrop/delivery:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Services/Delivery/SwiftDrop.Delivery.Api/SwiftDrop.Delivery.Api.csproj
    command: ["SwiftDrop.Delivery.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:8081
      ConnectionStrings__Database: ${DELIVERY_DATABASE_CONNECTION_STRING:-}
      Identity__Tokens__Issuer: https://identity.swiftdrop.invalid
      Identity__Tokens__Audience: swiftdrop-api-local
      Identity__Tokens__JwksUrl: http://identity-service:8080/.well-known/jwks.json
      Identity__Tokens__AllowInsecureJwks: "true"
      Operations__TimeZone: Asia/Colombo
      ProofStorage__Endpoint: ${DELIVERY_PROOF_STORAGE_ENDPOINT:-}
      ProofStorage__Bucket: ${DELIVERY_PROOF_STORAGE_BUCKET:-}
      ProofStorage__Region: ${DELIVERY_PROOF_STORAGE_REGION:-}
      ProofStorage__AccessKey: ${DELIVERY_PROOF_STORAGE_ACCESS_KEY:-}
      ProofStorage__SecretKey: ${DELIVERY_PROOF_STORAGE_SECRET_KEY:-}
      ProofStorage__SessionToken: ${DELIVERY_PROOF_STORAGE_SESSION_TOKEN:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  delivery-migrate:
    profiles: ["database-migrations"]
    image: swiftdrop/delivery:dev
    command: ["SwiftDrop.Delivery.Api.dll", "--migrate"]
    environment:
      ConnectionStrings__Database: ${DELIVERY_DATABASE_CONNECTION_STRING:-}
    restart: "no"

  notification-migrate:
    profiles: ["database-migrations"]
    image: swiftdrop/notification-worker:dev
    command: ["SwiftDrop.Notification.Worker.dll", "--migrate"]
    environment:
      ConnectionStrings__Database: ${NOTIFICATIONS_DATABASE_CONNECTION_STRING:-}
    restart: "no"

  merchant-service:
    image: swiftdrop/merchant:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Services/Merchant/SwiftDrop.Merchant.Api/SwiftDrop.Merchant.Api.csproj
    command: ["SwiftDrop.Merchant.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      ConnectionStrings__Database: ${MERCHANT_DATABASE_CONNECTION_STRING:-}
      Identity__Tokens__Issuer: https://identity.swiftdrop.invalid
      Identity__Tokens__Audience: swiftdrop-api-local
      Identity__Tokens__JwksUrl: http://identity-service:8080/.well-known/jwks.json
    depends_on:
      delivery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification-worker:
    image: swiftdrop/notification-worker:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Workers/SwiftDrop.Notification.Worker/SwiftDrop.Notification.Worker.csproj
    command: ["SwiftDrop.Notification.Worker.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      ConnectionStrings__Database: ${NOTIFICATIONS_DATABASE_CONNECTION_STRING:-}
      Notification__Broker__Host: rabbitmq
      Notification__Broker__VirtualHost: /
      Notification__Broker__Username: worker_bus
      Notification__Broker__Password: ${WORKER_BROKER_PASSWORD:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    image: swiftdrop/gateway:dev
    build:
      context: ../../swiftdrop-backend
      dockerfile: Dockerfile
      args:
        PROJECT_FILE: src/Gateway/SwiftDrop.Gateway/SwiftDrop.Gateway.csproj
    command: ["SwiftDrop.Gateway.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      ReverseProxy__Routes__identity-auth__Transforms__1__RequestHeaderOriginalHost: "true"
      ReverseProxy__Routes__identity-users__Transforms__0__RequestHeaderOriginalHost: "true"
      ReverseProxy__Routes__identity-audit-logs__Transforms__0__RequestHeaderOriginalHost: "true"
    ports:
      - "127.0.0.1:5000:8080"
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      identity-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      merchant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: swiftdrop/web:dev
    build:
      context: ../../swiftdrop-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_WEB_CLIENT_ID: ${VITE_GOOGLE_WEB_CLIENT_ID:-}
    ports:
      - "127.0.0.1:5173:8080"
    networks:
      default:
        ipv4_address: 172.28.0.11
    volumes:
      - ../deployment/nginx/swiftdrop-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  rabbitmq-data:
  identity-dataprotection:
  identity-keys:
